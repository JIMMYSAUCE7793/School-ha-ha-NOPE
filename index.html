<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Web Proxy</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 1rem;
    }

    .container {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 560px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
      text-align: center;
    }

    h1 {
      font-size: 1.75rem;
      margin-bottom: 0.5rem;
      letter-spacing: -0.02em;
    }

    p {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-bottom: 1.75rem;
    }

    .search-form {
      display: flex;
      gap: 0.5rem;
    }

    input[type="text"] {
      flex: 1;
      padding: 0.85rem 1rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background-color: var(--bg-color);
      color: var(--text-main);
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus {
      border-color: var(--accent);
    }

    button {
      padding: 0.85rem 1.5rem;
      border: none;
      border-radius: 8px;
      background-color: var(--accent);
      color: white;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    button:hover {
      background-color: var(--accent-hover);
    }

    .error-msg {
      color: #f87171;
      font-size: 0.85rem;
      margin-top: 0.75rem;
      display: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Web Proxy</h1>
    <p>Enter a destination URL or search term below to browse through the proxy.</p>

    <form class="search-form" id="proxyForm">
      <input
        type="text"
        id="urlInput"
        placeholder="https://example.com or search query"
        autocomplete="off"
        required
      />
      <button type="submit">Go</button>
    </form>

    <div class="error-msg" id="errorMsg">Please enter a valid URL or search term.</div>
  </div>

  <script>
    const form = document.getElementById("proxyForm");
    const urlInput = document.getElementById("urlInput");
    const errorMsg = document.getElementById("errorMsg");

    // Relative path to proxy.php (works in htdocs root or subfolders)
    const PROXY_ENDPOINT = "proxy.php?url=";

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      errorMsg.style.display = "none";

      let target = urlInput.value.trim();
      if (!target) {
        errorMsg.style.display = "block";
        return;
      }

      // Format input into a valid URL or fallback search query
      if (!/^https?:\/\//i.test(target)) {
        if (target.includes(".") && !target.includes(" ")) {
          target = "https://" + target;
        } else {
          // Uses DuckDuckGo's pure-HTML endpoint so searches work without JavaScript or API keys
          target = "https://html.duckduckgo.com/html/?q=" + encodeURIComponent(target);
        }
      }

      try {
        const validatedUrl = new URL(target);
        window.location.href = PROXY_ENDPOINT + encodeURIComponent(validatedUrl.href);
      } catch (err) {
        errorMsg.style.display = "block";
      }
    });
  </script>
</body>
</html>
